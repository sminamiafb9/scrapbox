[project]
name = "learn_text_classification"
version = "0.0.1"
description = "A sample text classification python project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    "ruff>=0.16.1",
]


[tool.uv]
exclude-newer = "7 days"

[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true


[tool.uv.build-backend]
include = ["src/learn_text_classification/py.typed"]


[tool.ruff]
target-version = "py312"
line-length = 88

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]


[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific
]

fixable = ["ALL"]

unfixable = [
    "B008",
]


[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

known-first-party = [
    "learn_text_classification",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false


[tool.pytest.ini_options]
addopts = [
    "--cov=learn_text_classification",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = [
    "tests",
]


[tool.poe.tasks]
lint = "ruff check ."
format = [
    { cmd = "ruff format ." },
    { cmd = "ruff check . --fix" },
]
typecheck = "pyright"
test = "pytest tests"
build = "uv build"

[tool.poe.tasks.check]
sequence = [
    "lint",
    "format",
    "typecheck",
    "test",
    "build",
]

# for Google Colab with Cli
[tool.poe.tasks.colab_deploy]
shell = """
    uv build &&
    WHEEL=$(find dist -maxdepth 1 -name 'learn_text_classification-*.whl' -print -quit) &&
    colab new -s learn_text_classification &&
    colab upload "$WHEEL" "lib/$(basename "$WHEEL")" &&
    colab install -s learn_text_classification "lib/$(basename "$WHEEL")"
"""

[tool.poe.tasks.colab_run]
shell = "colab exec -s learn_text_classification -f $file"
    [[tool.poe.tasks.colab_run.args]]
    name = "file"
    positional = true

[tool.poe.tasks.colab_stop]
cmd = "colab stop -s learn_text_classification"


[tool.poe.tasks.colab_connect]
shell = """
COLAB_IP=$(echo "hostname -I" | colab ssh -s learn_text_classification | sed 's/[[:space:]]*$//')

echo ""
echo "Colab IP: $COLAB_IP"
echo ""
echo "VS Code:"
echo "  Jupyter: Specify local or remote Jupyter server"
echo "  Server URL: http://127.0.0.1:8889"
echo ""

ssh \
  -o 'ProxyCommand=colab ssh --proxy-mode -s learn_text_classification' \
  -o StrictHostKeyChecking=no \
  -o UserKnownHostsFile=/dev/null \
  -o LogLevel=ERROR \
  -N \
  -L "8889:${COLAB_IP}:9000" \
  root@learn_text_classification
"""