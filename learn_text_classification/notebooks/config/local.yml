ingest:
  url: https://raw.githubusercontent.com/ids-cv/wrime/refs/heads/master/wrime-ver2.tsv
  volume: .tmp/raw_data

prepare:
  raw_data: /Volumes/sandbox/shotaro_minami8e40a5/learn_text_classification/raw_data/wrime-ver2.tsv
  dataset: sandbox.shotaro_minami8e40a5.wrime

preprocessing:
  dataset: sandbox.shotaro_minami8e40a5.wrime_binary

embedding:
  cache_folder: ./.cache/hf
  batch_size: 500
  transfer_batch_size: 5000
  embedding_model_name: cl-nagoya/ruri-v3-30m
  dataset: sandbox.shotaro_minami8e40a5.wrime_embeddings

experiments:
  baseline:
    run: 21_hyperparameter_tuning.py
    params:
      trainer: 31_logistic_regression.py
      direction: maximize
      n_startup_trials: 3
      n_trials: 5
      base_fixed_params:
        max_itr: 30
      suggest_params:
        regularization:
          method: suggest_float
          params:
            low: 1.0e-5
            high: 10.0
            log: true
        elastic_net:
          method: suggest_float
          params:
            low: 0.0
            high: 1.0

  logistic_regression:
    run: 31_logistic_regression.py
    params:
      max_itr: 30
