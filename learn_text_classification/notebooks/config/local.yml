ingest:
  url: https://raw.githubusercontent.com/ids-cv/wrime/refs/heads/master/wrime-ver2.tsv
  volume: .tmp/raw_data

prepare:
  raw_data: /Volumes/sandbox/shotaro_minami8e40a5/learn_text_classification/raw_data/wrime-ver2.tsv
  dataset: sandbox.shotaro_minami8e40a5.wrime

preprocessing:
  dataset: sandbox.shotaro_minami8e40a5.wrime_binary

embedding:
  cache_folder: ./.cache/hf
  batch_size: 500
  transfer_batch_size: 5000
  embedding_model_name: cl-nagoya/ruri-v3-30m
  dataset: sandbox.shotaro_minami8e40a5.wrime_embeddings

experiments:
  baseline: &baseline
    run: 21_hyperparameter_tuning.py
    params: &baseline_params
      trainer: 31_logistic_regression.py
      direction: maximize
      n_startup_trials: 10
      n_trials: 50
      base_fixed_params: &baseline_fixed_params
        max_itr: 30
      suggest_params:
        regularization:
          method: suggest_float
          params:
            low: 1.0e-5
            high: 1.0
            log: true
        elastic_net:
          method: suggest_float
          params:
            low: 0.0
            high: 1.0

  LR_Joy:
    <<: *baseline
    params:
      <<: *baseline_params
      base_fixed_params:
        <<: *baseline_fixed_params
        label_col: Joy

  LR_Sadness:
    <<: *baseline
    params:
      <<: *baseline_params
      base_fixed_params:
        <<: *baseline_fixed_params
        label_col: Sadness

  LR_Anticipation:
    <<: *baseline
    params:
      <<: *baseline_params
      base_fixed_params:
        <<: *baseline_fixed_params
        label_col: Anticipation

  LR_Surprise:
    <<: *baseline
    params:
      <<: *baseline_params
      base_fixed_params:
        <<: *baseline_fixed_params
        label_col: Surprise

  LR_Anger:
    <<: *baseline
    params:
      <<: *baseline_params
      base_fixed_params:
        <<: *baseline_fixed_params
        label_col: Anger

  LR_Fear:
    <<: *baseline
    params:
      <<: *baseline_params
      base_fixed_params:
        <<: *baseline_fixed_params
        label_col: Fear

  LR_Disgust:
    <<: *baseline
    params:
      <<: *baseline_params
      base_fixed_params:
        <<: *baseline_fixed_params
        label_col: Disgust

  LR_Trust:
    <<: *baseline
    params:
      <<: *baseline_params
      base_fixed_params:
        <<: *baseline_fixed_params
        label_col: Trust
