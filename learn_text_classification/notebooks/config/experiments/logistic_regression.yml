training:
  runs:
    # 共通パラメータ定義用
    baseline: &baseline
      run: 06u01_hyperparameter_tuning.py
      params: &baseline_params
        trainer: 06m01_logistic_regression.py
        direction: maximize
        n_startup_trials: 10
        n_trials: 50
        base_fixed_params: &baseline_fixed_params
          model_id: logistic_regression
          max_itr: 30
        suggest_params:
          regularization:
            method: suggest_float
            params:
              low: 1.0e-5
              high: 1.0
              log: true
          elastic_net:
            method: suggest_float
            params:
              low: 0.0
              high: 1.0

    LR_Joy:
      <<: *baseline
      params:
        <<: *baseline_params
        base_fixed_params:
          <<: *baseline_fixed_params
          label_col: Joy

    LR_Sadness:
      <<: *baseline
      params:
        <<: *baseline_params
        base_fixed_params:
          <<: *baseline_fixed_params
          label_col: Sadness

    LR_Anticipation:
      <<: *baseline
      params:
        <<: *baseline_params
        base_fixed_params:
          <<: *baseline_fixed_params
          label_col: Anticipation

    LR_Surprise:
      <<: *baseline
      params:
        <<: *baseline_params
        base_fixed_params:
          <<: *baseline_fixed_params
          label_col: Surprise

    LR_Anger:
      <<: *baseline
      params:
        <<: *baseline_params
        base_fixed_params:
          <<: *baseline_fixed_params
          label_col: Anger

    LR_Fear:
      <<: *baseline
      params:
        <<: *baseline_params
        base_fixed_params:
          <<: *baseline_fixed_params
          label_col: Fear

    LR_Disgust:
      <<: *baseline
      params:
        <<: *baseline_params
        base_fixed_params:
          <<: *baseline_fixed_params
          label_col: Disgust

    LR_Trust:
      <<: *baseline
      params:
        <<: *baseline_params
        base_fixed_params:
          <<: *baseline_fixed_params
          label_col: Trust

