experiments:
  baseline: &baseline
    run: 21_hyperparameter_tuning.py
    params: &baseline_params
      trainer: 31_logistic_regression.py
      direction: maximize
      n_startup_trials: 10
      n_trials: 50
      base_fixed_params: &baseline_fixed_params
        max_itr: 30
      suggest_params:
        regularization:
          method: suggest_float
          params:
            low: 1.0e-5
            high: 1.0
            log: true
        elastic_net:
          method: suggest_float
          params:
            low: 0.0
            high: 1.0

  LR_Joy:
    <<: *baseline
    params:
      <<: *baseline_params
      base_fixed_params:
        <<: *baseline_fixed_params
        label_col: Joy

  LR_Sadness:
