resources:
  jobs:
    learn_text_classification:
      name: learn_text_classification

      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/ingest.py
            base_parameters:
              profile: sandbox
              log_level: INFO
          environment_key: default

        - task_key: prepare
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/prepare.py
            base_parameters:
              profile: sandbox
              log_level: INFO
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/learn_text_classification-0.0.1-py3-none-any.whl
