resources:
  jobs:
    learn_text_classification:
      name: learn_text_classification

      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/01_data_ingest.py
            base_parameters: &default_params
              profile: sandbox
              log_level: INFO
          environment_key: &default_env default

        - task_key: prepare
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/02_data_prepare.py
            base_parameters: *default_params
          environment_key: *default_env

        - task_key: data_profiling
          depends_on:
            - task_key: prepare
          notebook_task:
            notebook_path: ../notebooks/03_data_profiling.py
            base_parameters: *default_params
          environment_key: *default_env

        - task_key: data_preprocessing
          depends_on:
            - task_key: prepare
          notebook_task:
            notebook_path: ../notebooks/04_data_preprocessing.py
            base_parameters: *default_params
          environment_key: *default_env

      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/learn_text_classification-0.0.1-py3-none-any.whl
