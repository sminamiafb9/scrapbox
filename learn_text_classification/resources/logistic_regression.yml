x-common-task-config:
  base_parameters: &shared_params
    profile: sandbox
    config: logistic_regression
    log_level: INFO
    runtime_environment: databricks

resources:
  jobs:
    logistic_regression:
      name: logistic_regression

      tasks:
        - task_key: lr_joy_training
          notebook_task:
            notebook_path: ../notebooks/06_model_training.py
            base_parameters: &default_params
              <<: *shared_params
              experiment_key: LR_Joy
          environment_key: &default_env default

        - task_key: lr_sadness_training
          notebook_task:
            notebook_path: ../notebooks/06_model_training.py
            base_parameters:
              <<: *default_params
              experiment_key: LR_Sadness
          environment_key: *default_env

        - task_key: lr_anticipation_training
          notebook_task:
            notebook_path: ../notebooks/06_model_training.py
            base_parameters:
              <<: *default_params
              experiment_key: LR_Anticipation
          environment_key: *default_env

        - task_key: lr_surprise_training
          notebook_task:
            notebook_path: ../notebooks/06_model_training.py
            base_parameters:
              <<: *default_params
              experiment_key: LR_Surprise
          environment_key: *default_env

        - task_key: lr_anger_training
          notebook_task:
            notebook_path: ../notebooks/06_model_training.py
            base_parameters:
              <<: *default_params
              experiment_key: LR_Anger
          environment_key: *default_env

        - task_key: lr_fear_training
          notebook_task:
            notebook_path: ../notebooks/06_model_training.py
            base_parameters:
              <<: *default_params
              experiment_key: LR_Fear
          environment_key: *default_env

        - task_key: lr_disgust_training
          notebook_task:
            notebook_path: ../notebooks/06_model_training.py
            base_parameters:
              <<: *default_params
              experiment_key: LR_Disgust
          environment_key: *default_env

        - task_key: lr_trust_training
          notebook_task:
            notebook_path: ../notebooks/06_model_training.py
            base_parameters:
              <<: *default_params
              experiment_key: LR_Trust
          environment_key: *default_env

        - task_key: lr_model_assembling
          depends_on:
            - task_key: lr_joy_training
            - task_key: lr_sadness_training
            - task_key: lr_anticipation_training
            - task_key: lr_surprise_training
            - task_key: lr_anger_training
            - task_key: lr_fear_training
            - task_key: lr_disgust_training
            - task_key: lr_trust_training
          notebook_task:
            notebook_path: ../notebooks/06ab_binary_relevance_assembling.py
            base_parameters: 
              <<: *default_params
              
          environment_key: *default_env

      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/learn_text_classification-0.0.1-py3-none-any.whl
