resources:
  jobs:
    learn_databricks_work:  # bundleのidとしての名前
      name: learn_databricks_work  # databricks上のジョブとしての名前

      tasks:
        # 複数のタスクを持てるためリスト指定
        - task_key: hello

          notebook_task:
            notebook_path: ../notebooks/hello.py

          # 実行環境の指定(defaultという環境を指定)
          environment_key: default

        - task_key: test_connect
          notebook_task:
            notebook_path: ../notebooks/test_connect.py
          environment_key: default

        - task_key: deploy_udf
          sql_task:
            file:
              path: ./queries/greet_udf.sql
            warehouse_id: e514c24082e98afd

        - task_key: test_func
          depends_on:
            - task_key: deploy_udf
          notebook_task:
            notebook_path: ../notebooks/test_func.py
          environment_key: default

      # Serverlessの実行環境定義
      environments:
        # 名前をつけて仕様を定義する
        - environment_key: default  # defaultという名前(上で指定しているもの)
          spec:
            environment_version: "6"
            # installするパッケージ
            dependencies:
              - ../dist/learn_databricks_work-0.0.1-py3-none-any.whl
